# Fly.io app config for the ClamAV scan proxy.
# Deploy from inside services/clamav-proxy/ — see README.md for the full
# walkthrough (fly launch, volume, secrets, then wiring the URL into the
# main FeyseFit app).

app = "feysefit-clamav-proxy" # fly apps create will ask you to confirm/rename this
primary_region = "lhr"        # pick the region closest to your Vercel deployment

[build]

[env]
  PORT = "8080"

[[mounts]]
  source = "clamav_data"
  destination = "/var/lib/clamav"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "90s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
