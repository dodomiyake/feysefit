name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, typecheck & production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Exercise the real Supabase code path. Values are non-secret build placeholders.
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-auth-secret-not-for-production
      NEXT_PUBLIC_USE_SUPABASE: "true"
      NEXT_PUBLIC_USE_API: "false"
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "false"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production configuration
        run: npm run build
